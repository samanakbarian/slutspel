# Bygger frontend vid varje push. Netlify bygger ocksa, men nar dess bygge
# misslyckas publicerar den ingenting och LAMNAR FORRA VERSIONEN UPPE — sajten
# svarar 200 med riktigt innehall och ser frisk ut. Det hande 8 september:
# `tsc -b` foll pa en oanvand variabel, och deployen stod still i ett dygn utan
# att nagon markte det.
#
# Det har jobbet gor samma fel synligt direkt i GitHub, pa den commit som
# orsakade det, i stallet for att upptackas nasta gang nagon undrar varfor en
# andring inte syns.
name: Bygg frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend_v2/package-lock.json

      - name: Installera
        working-directory: frontend_v2
        run: npm ci

      # `npm run build` kor prebuild (sitemap.mjs) som hamtar fran API:t. Nar
      # API:t inte svarar behaller den befintliga adresser i stallet for att
      # falla, sa bygget ar inte beroende av att API:t ar uppe.
      - name: Bygg
        working-directory: frontend_v2
        run: npm run build
