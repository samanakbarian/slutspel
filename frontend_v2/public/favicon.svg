<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sida 377">
  <!--
    Märket är sidnumret, som på Text-TV: numret först, alltid i gult mot svart.
    Det fanns redan i appens topbar men användes inte som logotyp — favikonen
    var en lila blixt ur en mall.

    Ritad som en ruta med rejäl radie så formen känns igen även vid 16 px, där
    siffrorna går förlorade. Färgen bär då resten: gult på svart är Text-TV.
  -->
  <rect width="64" height="64" rx="14" fill="#07110d"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#FFD44D" stroke-width="3"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="27" font-weight="700" letter-spacing="-0.5" fill="#FFD44D">377</text>
</svg>
